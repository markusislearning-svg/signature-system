<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Signature System - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h1, h2 { margin-top: 0; }

    .login-card {
      max-width: 450px;
      margin: 50px auto;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary { background: #2563eb; color: white; }
    .secondary { background: #6b7280; color: white; }
    .success { background: #16803c; color: white; }
    .danger { background: #dc2626; color: white; }

    .status {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success-message {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f3f4f6;
    }

    .signature {
      width: 160px;
      height: 70px;
      object-fit: contain;
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
    }

    .hidden { display: none !important; }

    .small {
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }

      .card {
        padding: 17px;
      }

      .login-card {
        margin: 25px auto;
      }

      button {
        width: 100%;
        margin: 4px 0;
      }

      .toolbar input {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGIN -->
    <section id="loginSection" class="card login-card">
      <h1>Admin Login</h1>
      <p class="small">Sign in with your Supabase admin account.</p>

      <div id="loginStatus" class="status"></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="Admin email">

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Password">

        <button id="loginButton" type="submit" class="primary">
          Login
        </button>
      </form>

      <p class="small">
        If Login does not work, this page will now display the actual error.
      </p>
    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="adminSection" class="hidden">
      <div class="card">
        <h1>Signature Submissions</h1>

        <div id="adminStatus" class="status"></div>

        <div class="toolbar">
          <input
            id="searchInput"
            type="search"
            placeholder="Search name or department">

          <button id="refreshButton" class="secondary" type="button">
            Refresh
          </button>

          <button id="exportButton" class="success" type="button">
            Export CSV
          </button>

          <button id="signOutButton" class="danger" type="button">
            Sign Out
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date / Time</th>
                <th>Name</th>
                <th>Department</th>
                <th>Signature</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <p id="emptyMessage" class="small hidden">
          No submissions found.
        </p>
      </div>
    </section>

  </div>

  <script>
    "use strict";

    let client = null;
    let submissions = [];

    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginStatus = document.getElementById("loginStatus");

    const adminStatus = document.getElementById("adminStatus");
    const searchInput = document.getElementById("searchInput");
    const refreshButton = document.getElementById("refreshButton");
    const exportButton = document.getElementById("exportButton");
    const signOutButton = document.getElementById("signOutButton");
    const tableBody = document.getElementById("tableBody");
    const emptyMessage = document.getElementById("emptyMessage");

    function showStatus(element, message, type) {
      element.textContent = message;
      element.className = "status " + type;
    }

    function clearStatus(element) {
      element.textContent = "";
      element.className = "status";
    }

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function csvEscape(value) {
      return '"' + String(value ?? "").replace(/"/g, '""') + '"';
    }

    function initializeSupabase() {
      if (!window.supabase) {
        throw new Error(
          "Supabase library did not load. Please check your internet connection."
        );
      }

      if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
        throw new Error(
          "Supabase configuration is missing. Make sure config.js is in the same folder as admin.html."
        );
      }

      client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );
    }

    async function checkSession() {
      try {
        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (data.session) {
          showAdmin();
          await loadSubmissions();
        } else {
          showLogin();
        }
      } catch (error) {
        showLogin();
        showStatus(
          loginStatus,
          "Unable to check login session: " + (error.message || error),
          "error"
        );
      }
    }

    function showLogin() {
      loginSection.classList.remove("hidden");
      adminSection.classList.add("hidden");
    }

    function showAdmin() {
      loginSection.classList.add("hidden");
      adminSection.classList.remove("hidden");
      clearStatus(loginStatus);
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      clearStatus(loginStatus);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showStatus(loginStatus, "Please enter your email and password.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        if (!data.session) {
          throw new Error("Login succeeded but no session was created.");
        }

        showAdmin();
        await loadSubmissions();

      } catch (error) {
        console.error("Login error:", error);

        let message = error && error.message
          ? error.message
          : "Unable to log in.";

        showStatus(loginStatus, "Login failed: " + message, "error");

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });

    async function loadSubmissions() {
      clearStatus(adminStatus);

      tableBody.innerHTML = "";
      emptyMessage.classList.add("hidden");

      try {
        const { data, error } = await client
          .from("signatures")
          .select("id,name,department,signature_data,created_at")
          .order("created_at", { ascending: false });

        if (error) {
          throw error;
        }

        submissions = data || [];
        renderTable();

      } catch (error) {
        console.error("Load submissions error:", error);

        showStatus(
          adminStatus,
          "Unable to load submissions: " + (error.message || error),
          "error"
        );
      }
    }

    function renderTable() {
      const term = searchInput.value.trim().toLowerCase();

      const filtered = submissions.filter(function(item) {
        return (
          String(item.name || "").toLowerCase().includes(term) ||
          String(item.department || "").toLowerCase().includes(term)
        );
      });

      tableBody.innerHTML = "";

      if (!filtered.length) {
        emptyMessage.classList.remove("hidden");
        return;
      }

      emptyMessage.classList.add("hidden");

      filtered.forEach(function(item) {
        const row = document.createElement("tr");

        row.innerHTML =
          "<td>" + escapeHtml(formatDate(item.created_at)) + "</td>" +
          "<td>" + escapeHtml(item.name) + "</td>" +
          "<td>" + escapeHtml(item.department) + "</td>" +
          "<td></td>";

        const signatureCell = row.children[3];

        if (item.signature_data) {
          const image = document.createElement("img");
          image.className = "signature";
          image.alt = "Signature";
          image.src = item.signature_data;
          signatureCell.appendChild(image);
        }

        tableBody.appendChild(row);
      });
    }

    searchInput.addEventListener("input", renderTable);

    refreshButton.addEventListener("click", async function() {
      refreshButton.disabled = true;
      refreshButton.textContent = "Refreshing...";

      await loadSubmissions();

      refreshButton.disabled = false;
      refreshButton.textContent = "Refresh";
    });

    exportButton.addEventListener("click", function() {
      const term = searchInput.value.trim().toLowerCase();

      const filtered = submissions.filter(function(item) {
        return (
          String(item.name || "").toLowerCase().includes(term) ||
          String(item.department || "").toLowerCase().includes(term)
        );
      });

      if (!filtered.length) {
        showStatus(adminStatus, "There are no submissions to export.", "error");
        return;
      }

      const rows = [
        ["Date / Time", "Name", "Department", "Signature Data"],
        ...filtered.map(function(item) {
          return [
            formatDate(item.created_at),
            item.name || "",
            item.department || "",
            item.signature_data || ""
          ];
        })
      ];

      const csv =
        "\uFEFF" +
        rows
          .map(function(row) {
            return row.map(csvEscape).join(",");
          })
          .join("\r\n");

      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);

      link.href = url;
      link.download = "signature-submissions-" + date + ".csv";

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);

      showStatus(
        adminStatus,
        "CSV export completed.",
        "success-message"
      );
    });

    signOutButton.addEventListener("click", async function() {
      signOutButton.disabled = true;
      signOutButton.textContent = "Signing out...";

      try {
        const { error } = await client.auth.signOut();

        if (error) throw error;

        submissions = [];
        showLogin();

        emailInput.value = "";
        passwordInput.value = "";

        showStatus(
          loginStatus,
          "You have been signed out.",
          "success-message"
        );

      } catch (error) {
        showStatus(
          adminStatus,
          "Unable to sign out: " + (error.message || error),
          "error"
        );

      } finally {
        signOutButton.disabled = false;
        signOutButton.textContent = "Sign Out";
      }
    });

    try {
      initializeSupabase();
      checkSession();
    } catch (error) {
      console.error("Initialization error:", error);

      showStatus(
        loginStatus,
        "Page setup error: " + (error.message || error),
        "error"
      );
    }
  </script>
</body>
</html>
